<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Physics Demo — Part 1 Scene 1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./static/styles.css" />
    <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <div class="row">
          <label>Part:</label>
          <select id="part-select"></select>
        </div>
        <div class="row">
          <label>Scene:</label>
          <select id="scene-select"></select>
        </div>
        <div id="integrator-row" class="row">
          <label>Integrator:</label>
          <select id="integrator-select"></select>
        </div>
        <div id="method-row" class="row" style="display:none">
          <label>Method:</label>
          <select id="method-select"></select>
        </div>
        <div class="row">
          <label for="speed-range">Speed: <span id="speed-value">1.0x</span></label>
          <input id="speed-range" type="range" min="0" max="10" step="0.1" value="1" />
          <button id="reset-speed-button" type="button">Reset</button>
        </div>
        <div class="row">
          <label for="damping-range">Damping: <span id="damping-value">0.00</span></label>
          <input id="damping-range" type="range" min="0" max="0.9" step="0.0001" value="0" />
          <button id="reset-damping-button" type="button">Reset</button>
        </div>
        <div class="row">
          <label for="friction-range">Friction: <span id="friction-value">1.00</span></label>
          <input id="friction-range" type="range" min="0" max="2" step="0.01" value="1" />
          <button id="reset-friction-button" type="button">Reset</button>
        </div>
        <div class="row">
          <button id="reset-button" type="button">Reset scene</button>
        </div>
        <div id="stats">
          <div>Initial |L|: <span id="L0">—</span></div>
          <div>Current |L|: <span id="Lcur">—</span></div>
          <div>Energy: <span id="energy">—</span></div>
          <div>Spring length: <span id="springLen">—</span></div>
          <div>Spring force: <span id="springForce">—</span></div>
          <div>Spring energy: <span id="springEnergy">—</span></div>
          <div>Total energy: <span id="totalEnergy">—</span></div>
        </div>
      </div>
      <div id="canvas-container"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
