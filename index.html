<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HW2 — XPBD Deformable Body (Scene 1)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="viewport"></div>

    <aside id="panel">
      <h1>HW2 — Scene 1</h1>
      <p class="muted">Деформируемое тело (XPBD): ребра оболочки + 1 ограничение на объем. Точки можно перетаскивать мышью.</p>

      <div class="group">
        <label>
          Итерации: <span id="iterationsValue"></span>
          <input id="iterations" type="range" min="1" max="40" step="1" />
        </label>

        <label>
          Compliance (ребра): <span id="complianceEdgesValue"></span>
          <input id="complianceEdges" type="range" min="0" max="0.0005" step="0.000001" />
        </label>

        <label>
          Compliance (объем): <span id="complianceVolumeValue"></span>
          <input id="complianceVolume" type="range" min="0" max="0.001" step="0.000001" />
        </label>

        <label>
          Гравитация: <span id="gravityValue"></span>
          <input id="gravity" type="range" min="0" max="30" step="0.1" />
        </label>

        <label>
          Дэмпинг: <span id="dampingValue"></span>
          <input id="damping" type="range" min="0" max="0.05" step="0.0005" />
        </label>

        <label>
          Радиус точек: <span id="particleRadiusValue"></span>
          <input id="particleRadius" type="range" min="0.02" max="0.12" step="0.005" />
        </label>

        <label>
          Коэф. трения (пока не используется): <span id="frictionValue"></span>
          <input id="friction" type="range" min="0" max="2" step="0.01" />
        </label>
      </div>

      <div class="row">
        <button id="reset">Reset</button>
        <button id="pause">Pause</button>
      </div>

      <div class="group">
        <div id="status" class="status">Загрузка…</div>
      </div>

      <div class="group">
        <div class="hint">
          <div><b>Управление:</b> ЛКМ — схватить точку, ПКМ/колесо — OrbitControls.</div>
          <div class="muted">Закрепленные точки — красные. Перетаскиваемая — желтая.</div>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
